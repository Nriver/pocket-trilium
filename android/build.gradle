allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { subproject ->
    if (subproject.name == "flutter_inappwebview_android") {
        subproject.tasks.configureEach { task ->
            if (task.name.startsWith("merge") && task.name.endsWith("ConsumerProguardFiles")) {
                task.doFirst {
                    def consumerRules = new File(subproject.projectDir, "consumer-rules.pro")
                    if (!consumerRules.exists()) {
                        consumerRules.text = ""
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
